<!DOCTYPE html>
<html>

<head>
    <title>Contact</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body>
    <!-- Logo de la Universidad -->
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="../images/Logo-YT-Azul-Transparencia.png" alt="Logo de Yachay Tech"
            style="max-width: 250px; height: auto;">
    </div>

    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="../index.html">Home</a> |
            <a href="courses.html">Courses</a> |
            <a href="schedule.html">Schedule</a> |
            <a href="hobbies.html">Hobbies</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <form action="#" method="get">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="program">Degree Program:</label>
            <input type="text" id="program" name="program" value="Computer Science"><br><br>

            <label for="semester">Semester:</label>
            <input type="number" id="semester" name="semester" value="7" min="1" max="10"><br><br>

            <label for="reason">Reason for Contact:</label>
            <select id="reason" name="reason">
                <option value="academic">Academic inquiry</option>
                <option value="project">Project collaboration</option>
                <option value="other">Other</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

            <input type="checkbox" id="accept" name="accept" required>
            <label for="accept">I accept the terms and conditions</label><br><br>

            <input type="submit" value="Submit">
        </form>
    </main>
</body>

</html>
